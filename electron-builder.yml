appId: com.yxy9022.app
productName: v-easy
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
win:
  executableName: v-easy
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # 控制 zip 产物命名（dmg 由下方 dmg.artifactName 单独指定，优先级更高）
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  # 无 Apple 开发者证书时使用 ad-hoc 签名（"-"）。
  # 必须签名而不能设为 null：asarUnpack 解包 ffmpeg 后，Electron 框架自带的签名
  # 与实际资源不符，macOS 会判定应用「已损坏」且无法打开；ad-hoc 深度签名会
  # 覆盖全部嵌套内容（含解包的 ffmpeg），使产物可被右键 → 打开正常运行。
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.utilities
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # notarize 默认行为：检测到 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # 环境变量时自动公证，未配置则跳过（不在本地/CI 报错）。无需显式设为 false。
dmg:
  artifactName: ${productName}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${productName}-${version}.${ext}
npmRebuild: false
# GitHub Releases 分发：electron-builder 会从 package.json 的 repository 推断仓库，
# 发布命令：GH_TOKEN=<token> npm run build:mac -- --publish=always
publish:
  provider: github
  # 先用草稿模式上传（草稿不校验 tag，避免 422 "must have a valid tag" 错误），
  # 全部平台 assets 上传完成后，由 CI 的 publish-release job 调用 API 转正为正式发布。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
