name: Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:  # 允许在 Actions 页面手动触发

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run build:mac -- --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 如需公证，在仓库 Secrets 里配置以下三项：
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build & Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run build:win -- --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
