name: Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:  # 允许在 Actions 页面手动触发

jobs:
  # 第一个 job：macOS 创建 Release 并上传安装包
  release-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build & Publish (macOS)
        run: npm run build:mac -- --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 如需公证，在仓库 Secrets 里配置以下三项：
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # 第二个 job：Windows 等 macOS 发布完成后，只上传资产到同一个 Release
  # package.json 的 optionalDependencies 已显式声明双平台 rollup 原生包，
  # 因此这里直接用 npm install 即可，无需删除 lock 或手动补装。
  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build & Upload (Windows)
        run: npm run build:win -- --publish=onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  # 第三个 job：等 mac/win 的 assets 全部上传完成后，
  # 把 electron-builder 创建的草稿 Release 转正为正式发布。
  # （直接让 electron-builder 发正式 Release 会因 tag 尚未生效而报 422）
  publish-release:
    needs: [release-mac, release-win]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "发布 tag: $TAG"
          API="https://api.github.com/repos/${{ github.repository }}"
          # 等待 GitHub 侧 tag 生效
          sleep 10
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" "$API/releases/tags/$TAG" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const r=JSON.parse(s);console.log(r.id||'')})")
          if [ -z "$RELEASE_ID" ]; then
            echo "未找到 $TAG 对应的 Release"
            exit 1
          fi
          echo "Release ID: $RELEASE_ID"
          curl -s -X PATCH -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "$API/releases/$RELEASE_ID" > /dev/null
          echo "✅ 已发布为正式 Release: $TAG"
