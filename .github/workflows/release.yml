name: Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:  # 允许在 Actions 页面手动触发

jobs:
  # 第一个 job：macOS 创建 Release 并上传安装包
  release-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 不用 npm ci：lock 仅在 macOS 生成，缺少 Windows 平台的 rollup 原生二进制。
      # 改用 npm install 让 npm 按当前 runner 平台自动安装对应 optionalDependency。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build & Publish (macOS)
        run: npm run build:mac -- --publish=always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # 如需公证，在仓库 Secrets 里配置以下三项：
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # 第二个 job：Windows 等 macOS 发布完成后，只上传资产到同一个 Release
  release-win:
    needs: release-mac
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json 在 macOS 生成，会锁死平台导致 Windows 上缺失
      # rollup 原生二进制（npm optional dependency bug）。按 npm 官方建议，
      # 删除 lock 与 node_modules 后重新 install，让 npm 按当前平台解析依赖。
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @rollup/rollup-win32-x64-msvc

      - name: Build & Upload (Windows)
        run: npm run build:win -- --publish=onTagOrDraft
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
